services:
  - type: web
    name: fabrient-engineering
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GMAIL_OAUTH_JSON
        sync: false
      - key: REVENUECAT_CONFIG
        sync: false
      - key: FABRIENT_ALLOWED_ORIGINS
        value: https://fabrinat-omega.vercel.app,https://getfabrient.com,https://www.getfabrient.com

  - type: web
    name: fabrient-mcp
    runtime: docker
    dockerfilePath: ./services/mcp/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FABRIENT_ENGINE_URL
        value: https://fabrient-engineering.onrender.com
      - key: FABRIENT_MCP_OAUTH_ISSUER
        value: https://fabrient-mcp.onrender.com
      - key: FABRIENT_MCP_RESOURCE_URL
        value: https://fabrient-mcp.onrender.com/mcp
