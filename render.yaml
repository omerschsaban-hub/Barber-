databases:
  - name: fabrient-postgres
    databaseName: fabrient
    user: fabrient
    plan: basic-256mb

services:
  - type: web
    name: fabrient-engineering
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - engineering/**
        - services/**
        - db/**
        - Dockerfile
        - tests/**
        - shared/**
        - package.json
        - package-lock.json
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fabrient-postgres
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: GMAIL_OAUTH_JSON
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_HOBBY_PLAN_ID
        sync: false
      - key: PAYPAL_STARTUP_PLAN_ID
        sync: false
      - key: DATA_FLYWHEEL_RUN_TOKEN
        sync: false
      - key: DATA_FLYWHEEL_INGEST_SECRET
        sync: false
      - key: DB_POOL_MIN
        value: "2"
      - key: DB_POOL_MAX
        value: "8"
      - key: MAX_STEP_BYTES
        value: "25000000"
      - key: MAX_COMPRESSED_BYTES
        value: "10000000"
      - key: FLYWHEEL_ENABLE_PRODUCTION
        value: "true"
      - key: FLYWHEEL_SCHEDULER_ENABLED
        value: "true"
      - key: FLYWHEEL_INTERVAL_SECONDS
        value: "1800"
      - key: FABRIENT_ALLOWED_ORIGINS
        value: https://fabrinat-omega.vercel.app,https://getfabrient.com,https://www.getfabrient.com

  - type: web
    name: fabrient-mcp
    runtime: docker
    dockerfilePath: ./services/mcp/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/mcp/**
        - db/migrations/**
        - tests/mcp/**
        - shared/**
        - services/common/**
        - services/mcp/Dockerfile
        - services/mcp/requirements.txt
    envVars:
      - key: FABRIENT_ENGINE_URL
        value: https://fabrient-engineering.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fabrient-postgres
          property: connectionString
      - key: FABRIENT_MCP_OAUTH_ISSUER
        value: https://fabrient-mcp.onrender.com
      - key: FABRIENT_MCP_RESOURCE_URL
        value: https://fabrient-mcp.onrender.com/mcp
