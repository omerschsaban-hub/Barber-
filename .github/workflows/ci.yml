name: Fabrient CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabrient-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: Engineering tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/engineering
    defaults:
      run:
        working-directory: engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engineering/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app tests
      - run: pytest -q

  mcp:
    name: MCP 100-tool real call test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/mcp/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Create isolated engineering runtime
        working-directory: engineering
        run: |
          python -m venv /tmp/fabrient-engineering-venv
          /tmp/fabrient-engineering-venv/bin/python -m pip install --upgrade pip
          /tmp/fabrient-engineering-venv/bin/pip install -r requirements.txt
      - name: Start engineering runtime
        working-directory: services/engine
        run: |
          set -euo pipefail
          /tmp/fabrient-engineering-venv/bin/uvicorn app:app --host 127.0.0.1 --port 8001 >/tmp/engine-for-mcp.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/engine-for-mcp.log; exit 1; fi
      - name: Registry, compile and server smoke
        env:
          FABRIENT_ENGINE_URL: http://127.0.0.1:8001
        run: |
          set -euo pipefail
          python -m py_compile server.py smoke_test.py ../../mcp_server.py ../../mcp_capabilities.py
          python -c "import mcp_server; assert len(mcp_server.CAPABILITY_NAMES)==100; assert len(set(mcp_server.CAPABILITY_NAMES))==100"
          PYTHONPATH=../..:${PYTHONPATH:-} python -c "import mcp_server; assert 'extract_step_geometry' in mcp_server.CAPABILITIES; assert 'inspect_part' in mcp_server.CAPABILITIES"
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 >/tmp/mcp.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/mcp.log; exit 1; fi
          MCP_URL=http://127.0.0.1:8000/mcp python smoke_test.py

  engineering-api:
    name: Engineering API contract smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLYWHEEL_SCHEDULER_ENABLED: 'false'
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m py_compile main.py
      - name: Import API application
        run: python -c "from main import app; print('Engineering API import OK')"
      - name: Start API
        run: |
          set -euo pipefail
          uvicorn main:app --host 127.0.0.1 --port 8001 >/tmp/engine.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/engine.log; exit 1; fi
      - name: Verify API routes are callable
        run: |
          python - <<'PY'
          import json, urllib.request
          base='http://127.0.0.1:8001'
          checks=[
              ('/health',None),
              ('/v1/dfm/analyze',{'part_name':'CI fixture','revision':'A','material':'PETG','machine':'FDM printer','measurements':{'wall_thickness_mm':1.0,'clearance_mm':0.15,'hole_diameter_mm':2.4,'overhang_deg':55,'bridge_mm':8,'tolerance_mm':0.2}}),
              ('/v1/dfm/self-fix',{'part_name':'CI fixture','revision':'A','material':'PETG','machine':'FDM printer','measurements':{'wall_thickness_mm':1.0,'clearance_mm':0.15,'hole_diameter_mm':2.4,'overhang_deg':55,'bridge_mm':8,'tolerance_mm':0.2}}),
          ]
          for path,body in checks:
              if body is None:
                  r=urllib.request.urlopen(base+path,timeout=10)
              else:
                  data=json.dumps(body).encode(); r=urllib.request.urlopen(urllib.request.Request(base+path,data=data,headers={'content-type':'application/json'}),timeout=10)
              assert 200 <= r.status < 300, (path,r.status)
              print(path,r.status)
          PY

  frontend-root:
    name: Frontend production build and route smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_ENGINEERING_API: http://127.0.0.1:8001
        run: npm run build
      - name: Start production server
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_ENGINEERING_API: http://127.0.0.1:8001
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/web.log 2>&1 &
          pid=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/web.log; exit 1; fi
      - name: Smoke every shipped route
        run: |
          set -euo pipefail
          for route in / /login /calibration /experiments /geometry /graph /import /manufacturing /projects /records /risk-map; do
            echo "SMOKE $route"
            code=$(curl -sS -o /tmp/route.html -w '%{http_code}' --max-time 15 "http://127.0.0.1:3000$route")
            case "$code" in 2??|3??) ;; *) cat /tmp/route.html; exit 1;; esac
            ! grep -Eiq 'Application error|Unhandled Runtime Error|Internal Server Error' /tmp/route.html
          done

  frontend-secondary:
    name: Secondary web production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_ENGINEERING_API: http://127.0.0.1:8001
        run: npm run build
