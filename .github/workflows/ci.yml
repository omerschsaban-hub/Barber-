name: Fabrient CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fabrient-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: Engineering tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engineering
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engineering/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Compile check
        run: python -m compileall -q app tests
      - name: Engineering tests
        run: pytest -q

  mcp:
    name: MCP registry and all-tool call smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/mcp/requirements.txt
      - name: Install MCP dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile MCP server and smoke test
        env:
          FABRIENT_ENGINE_URL: https://example.invalid
        run: |
          python -m py_compile server.py smoke_test.py
          python -c "import server; assert len(server.CAPABILITY_NAMES) == 100; assert len(set(server.CAPABILITY_NAMES)) == 100; print('authoritative registry:', len(server.CAPABILITY_NAMES))"
          python -m uvicorn server:app --host 127.0.0.1 --port 8000 >/tmp/fabrient-mcp.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          MCP_URL=http://127.0.0.1:8000/mcp python smoke_test.py

  frontend-root:
    name: Root frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_ENGINEERING_API: http://127.0.0.1:8000
        run: npm run build

  frontend-secondary:
    name: Secondary web production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_ENGINEERING_API: http://127.0.0.1:8000
        run: npm run build
