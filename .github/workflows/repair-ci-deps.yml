name: Repair CI dependency isolation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'repair-ci-deps') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Include MCP root dependency set in engineering CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          s = s.replace("- run: python -m pip install --upgrade pip && pip install -r requirements.txt\n      - run: python -m pip check", "- run: python -m pip install --upgrade pip && pip install -r requirements.txt -r ../requirements.txt\n      - run: python -m pip check", 1)
          p.write_text(s)
          PY
          grep -n 'pip install.*requirements' .github/workflows/ci.yml
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git rm .github/workflows/repair-ci-deps.yml
          git commit -m 'repair-ci-deps: install MCP dependencies in engineering CI'
          git push
