name: Video hardening audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hardening-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic hardening audit
        run: node scripts/video-hardening-audit.mjs
