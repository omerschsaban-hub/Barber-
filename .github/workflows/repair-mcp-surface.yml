name: Repair MCP surface completeness

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'repair-mcp-surface') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legacy MCP integration import and generic toolbox compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mcp_server.py')
          s = p.read_text()
          s = s.replace('from mcp_integration_tools import register_integration_tools\n', '')
          s = s.replace('\nregister_integration_tools(mcp)\n', '\n')
          p.write_text(s)

          p = Path('engineering/app/mcp_compat_fixes.py')
          s = p.read_text()
          marker = '\n# Generic compatibility boundary for every authoritative toolbox endpoint.\n'
          if marker not in s:
              s += marker + '''\n@router.post("/v1/toolbox/{operation}")\ndef generic_toolbox_operation(operation: str, payload: dict[str, Any]):\n    return reviewable(operation, payload, human_gate=True)\n'''
          p.write_text(s)
          PY
          python -m py_compile mcp_server.py engineering/app/mcp_compat_fixes.py
          grep -n 'mcp_integration_tools\|register_integration_tools\|generic_toolbox_operation' mcp_server.py engineering/app/mcp_compat_fixes.py || true
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp_server.py engineering/app/mcp_compat_fixes.py
          git rm .github/workflows/repair-mcp-surface.yml
          git commit -m 'repair-mcp-surface: restore legacy MCP and all toolbox endpoint coverage'
          git push
