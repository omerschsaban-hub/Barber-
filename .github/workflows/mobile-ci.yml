name: Fabrient Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/mobile-native/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/mobile-native/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    name: Expo mobile validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Expo web export
        run: npx expo export --platform web
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  native-source-contracts:
    name: Native client source contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source is secret-free
        run: |
          ! grep -RInE --exclude='*.md' '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY|ghp_[A-Za-z0-9]{20,})' apps/mobile-native
          test -f apps/mobile-native/android/src/main/kotlin/im/fabrient/mobile/FabrientApi.kt
          test -f apps/mobile-native/ios/Sources/FabrientMobile/FabrientAPI.swift
      - name: Kotlin contract tests when Gradle is installed
        working-directory: apps/mobile-native/android
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle test --no-daemon
          else
            echo 'Gradle is not installed on this runner; source contract checks completed.'
          fi
      - name: Swift package tests when Swift is installed
        working-directory: apps/mobile-native/ios
        run: |
          if command -v swift >/dev/null 2>&1; then
            swift test
          else
            echo 'Swift is not installed on this runner; source contract checks completed.'
          fi
