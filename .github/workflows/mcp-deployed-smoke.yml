name: Deployed MCP 100-tool smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-mcp:
    name: Real deployed MCP tools/list + 100 tools/call
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/mcp/requirements.txt

      - name: Install MCP client dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Wait for Render deployment
        env:
          HEALTH_URL: https://fabrient-mcp.onrender.com/health
        run: |
          for i in $(seq 1 120); do
            if curl --fail --silent --show-error "$HEALTH_URL"; then
              echo
              echo "Deployed MCP is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for deployed MCP health endpoint"
          exit 1

      - name: Run the actual deployed 100/100 MCP test
        env:
          MCP_URL: https://fabrient-mcp.onrender.com/mcp
        run: python smoke_test.py
