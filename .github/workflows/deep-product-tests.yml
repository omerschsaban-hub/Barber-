name: Deep Frontend Product Tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deep-frontend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-unit-and-build:
    name: Frontend unit/build/functionality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:unit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_ENGINEERING_API: http://127.0.0.1:8000
          NEXT_PUBLIC_ENGINEERING_URL: http://127.0.0.1:8000
          FABRIENT_WEB_ORIGIN: http://127.0.0.1:3000

  browser:
    name: Frontend browser/E2E functionality
    needs: web-unit-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_ENGINEERING_API: http://127.0.0.1:8000
          NEXT_PUBLIC_ENGINEERING_URL: http://127.0.0.1:8000
          FABRIENT_WEB_ORIGIN: http://127.0.0.1:3000
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore

  frontend-security-and-scaling:
    name: Frontend security/scaling/technical checks
    needs: web-unit-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Production build integrity
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_ENGINEERING_API: http://127.0.0.1:8000
          NEXT_PUBLIC_ENGINEERING_URL: http://127.0.0.1:8000
          FABRIENT_WEB_ORIGIN: http://127.0.0.1:3000
      - name: Frontend production-footgun scan
        run: |
          set -e
          if grep -RInE 'console\.log\(|TODO.*security|FIXME.*security|dangerouslySetInnerHTML' app components src 2>/dev/null; then
            echo 'Potential frontend production issue found; inspect before release.'
            exit 1
          fi
      - name: Check for oversized frontend assets
        run: |
          set -e
          if [ -d .next/static ]; then
            bad=$(find .next/static -type f -size +2M -print)
            if [ -n "$bad" ]; then
              echo 'Frontend asset exceeds 2MB:'
              echo "$bad"
              exit 1
            fi
          fi
