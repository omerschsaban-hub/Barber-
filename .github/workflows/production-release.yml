name: Fabrient Production Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fabrient-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deep-validation:
    name: Deep validation gate
    uses: ./.github/workflows/deep-product-tests.yml

  release:
    name: Verify latest main in Production
    needs: deep-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Enforce 50-release rolling 24h safety cap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '24 hours ago' +%s)
          count=0
          while IFS=$'\t' read -r ts conclusion; do
            [ -z "$ts" ] && continue
            [ "$conclusion" = "success" ] || continue
            epoch=$(date -u -d "$ts" +%s)
            if [ "$epoch" -ge "$cutoff" ]; then count=$((count+1)); fi
          done < <(gh run list --workflow production-release.yml --limit 100 --json startedAt,conclusion --jq '.[] | [.startedAt,.conclusion] | @tsv')
          echo "Successful production-release deployments in rolling 24h: $count"
          if [ "$count" -ge 50 ]; then
            echo '50 successful production-release deployments have already occurred in the rolling 24h window; refusing another verification.'
            exit 1
          fi

      - name: Verify Git-connected production deployment
        env:
          FABRIENT_WEB_URL: ${{ secrets.FABRIENT_WEB_URL }}
        run: |
          set -euo pipefail
          web_url="${FABRIENT_WEB_URL:-https://fabrinat-omega.vercel.app}"
          echo "Verifying production URL: $web_url"
          for attempt in $(seq 1 30); do
            body=$(mktemp)
            status=$(curl -L -sS --max-time 30 -o "$body" -w '%{http_code}' "$web_url/") || status=000
            if [ "$status" = 200 ] && grep -q 'START A PROJECT' "$body" && grep -q 'Fabrient' "$body"; then
              echo "Production deployment is serving the expected landing page (HTTP 200)."
              rm -f "$body"
              exit 0
            fi
            echo "Attempt $attempt/30: production not ready yet (HTTP $status); waiting 10 seconds."
            rm -f "$body"
            sleep 10
          done
          echo 'The Git-connected production deployment did not become ready with the expected landing page.'
          exit 1

      - name: Verify production engineering and MCP health
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://fabrient-engineering.onrender.com/health
          curl -fsS --max-time 30 https://fabrient-mcp.onrender.com/health
