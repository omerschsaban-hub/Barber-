name: Fabrient Controlled Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the latest validated main revision
        required: true
        default: true
        type: boolean

# One release coordinator at a time. New commits are validated, but only the
# newest commit still at the head of main is allowed to consume deployment slots.
concurrency:
  group: fabrient-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit/build gate
        run: |
          npm run test:unit
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_ENGINEERING_API: http://127.0.0.1:8000
          NEXT_PUBLIC_ENGINEERING_URL: http://127.0.0.1:8000
          FABRIENT_WEB_ORIGIN: http://127.0.0.1:3000

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engineering/requirements.txt
          pip install -r services/mcp/requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Backend validation gate
        run: |
          ruff check engineering services/mcp tests
          pytest -q tests/unit tests/mcp

      - name: Verify this commit is still the release candidate
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current="$(git rev-parse HEAD)"
          head="$(git rev-parse origin/main)"
          echo "candidate=$current"
          echo "origin/main=$head"
          if [ "$current" != "$head" ]; then
            echo 'A newer commit is already on main; this run will not deploy.'
            exit 78
          fi

  render:
    name: Deploy Render services sequentially
    needs: validate
    if: ${{ needs.validate.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check required Render credential
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: test -n "$RENDER_API_KEY"

      - name: Discover Fabrient Render services
        id: services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: tea-d6ptbvnafjfc73al64q0
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?ownerId=$RENDER_OWNER_ID&limit=100" > /tmp/render-services.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/render-services.json'))
          items=data if isinstance(data,list) else data.get('items',[])
          ids=[]
          for item in items:
              s=item.get('service',item)
              name=s.get('name','')
              if name.startswith('fabrient-') and s.get('type') == 'web_service':
                  ids.append((name,s['id']))
          ids.sort()
          if not ids:
              raise SystemExit('No Fabrient Render web services were discovered')
          print('Discovered:', ids)
          with open('/tmp/render-service-ids','w') as f:
              for name,sid in ids:
                  f.write(f'{name}\t{sid}\n')
          PY

      - name: Disable commit-by-commit Render auto-deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name sid; do
            echo "Disabling auto-deploy for $name"
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Content-Type: application/json' \
              -d '{"autoDeploy":"no"}' \
              "https://api.render.com/v1/services/$sid"
          done < /tmp/render-service-ids

      - name: Deploy each Render service at the exact tested commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name sid; do
            echo "Deploying $name at $COMMIT_SHA"
            response=$(curl -fsS -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"commitId\":\"$COMMIT_SHA\"}" \
              "https://api.render.com/v1/services/$sid/deploys")
            echo "$response"
            sleep 5
          done < /tmp/render-service-ids

  vercel:
    name: Deploy Vercel projects through one controlled lane
    needs: validate
    if: ${{ needs.validate.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check required Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"

      - name: Discover projects linked to this repository
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_c7jiZ6npatXSxCLniu2AVVWi
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?teamId=$VERCEL_TEAM_ID&limit=100" > /tmp/vercel-projects.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vercel-projects.json'))
          projects=data.get('projects',[])
          selected=[]
          for p in projects:
              link=p.get('link') or {}
              repo=link.get('repo','')
              if repo == 'omerschsaban-hub/Barber-':
                  selected.append((p['name'],p['id']))
          selected.sort()
          if not selected:
              raise SystemExit('No Vercel projects linked to omerschsaban-hub/Barber- were discovered')
          print('Discovered:', selected)
          with open('/tmp/vercel-projects','w') as f:
              for name,pid in selected:
                  f.write(f'{name}\t{pid}\n')
          PY

      - name: Deploy linked Vercel projects one at a time
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_c7jiZ6npatXSxCLniu2AVVWi
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name pid; do
            echo "Deploying Vercel project $name at main"
            curl -fsS -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "{\"name\":\"$name\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":117716146,\"ref\":\"main\"}}" \
              "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID&project=$pid"
            sleep 10
          done < /tmp/vercel-projects
