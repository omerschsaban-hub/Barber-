name: Repair deployed MCP transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'repair: mcp stateful') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore session-capable Streamable HTTP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('services/mcp/server.py')
          s = p.read_text()
          old = '    stateless_http=True,\n'
          if old not in s:
              raise SystemExit('expected stateless_http=True constructor setting not found')
          p.write_text(s.replace(old, ''))
          PY
          grep -n 'FastMCP\|stateless_http\|streamable_http_app' services/mcp/server.py
      - name: Commit transport repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mcp/server.py
          git commit -m 'repair: mcp stateful transport'
          git push
