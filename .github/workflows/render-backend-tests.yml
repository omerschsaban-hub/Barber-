name: Fabrient Render Backend Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: render-backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Render backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-asyncio httpx ruff

      - name: Backend lint
        run: ruff check .

      - name: Backend unit and API tests
        run: pytest -q

      - name: MCP contract tests
        run: pytest -q tests/mcp

      - name: Backend import/startup smoke test
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          candidates = [
              Path('backend/main.py'),
              Path('app/main.py'),
              Path('main.py'),
              Path('src/main.py'),
          ]
          for p in candidates:
              if p.exists():
                  spec = importlib.util.spec_from_file_location('fabrient_backend_smoke', p)
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
                  print(f'Imported backend entrypoint: {p}')
                  break
          else:
              print('No conventional backend entrypoint found; pytest/API tests remain the startup gate.')
          PY

      - name: Search for obvious production footguns
        run: |
          set -e
          if grep -RInE 'TODO.*security|FIXME.*security|debug *= *True|allow_origins *= *\["\*"\]' backend app src 2>/dev/null; then
            echo 'Potential backend production footgun found.'
            exit 1
          fi

      - name: Render deploy configuration sanity
        run: |
          test -f render.yaml || test -f render.yml || echo 'No render.yaml/render.yml found; deployment may be configured in Render dashboard.'
