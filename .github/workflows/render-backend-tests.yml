name: Fabrient Render Backend Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: render-backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Render backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engineering backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engineering/requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Backend lint
        run: ruff check engineering services/mcp tests

      - name: Backend unit and API tests
        run: pytest -q tests/unit tests/mcp

      - name: Engineering application import and health contract
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'engineering')
          from app.composed import app
          from fastapi.testclient import TestClient

          client = TestClient(app)
          response = client.get('/health')
          assert response.status_code == 200, response.text
          print('engineering /health:', response.status_code, response.text)
          PY

      - name: MCP application import smoke test
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'services/mcp')
          import auth_server
          assert getattr(auth_server, 'app', None) is not None
          print('MCP auth_server.app imported successfully')
          PY

      - name: Backend security checks
        run: |
          set -e
          if grep -RInE 'debug *= *True|allow_origins *= *\["\*"\]|verify *= *False|ssl_verify *= *False' engineering services/mcp 2>/dev/null; then
            echo 'Potential insecure production configuration found.'
            exit 1
          fi

      - name: Backend production-footgun scan
        run: |
          set -e
          if grep -RInE 'TODO.*security|FIXME.*security|password *= *["'"'][^$]' engineering services/mcp 2>/dev/null; then
            echo 'Potential backend production footgun found; inspect before release.'
            exit 1
          fi

      - name: Render configuration sanity
        run: |
          test -f render.yaml || test -f render.yml
          grep -q 'fabrient-engineering' render.yaml 2>/dev/null || grep -q 'fabrient-engineering' render.yml
          grep -q 'fabrient-mcp' render.yaml 2>/dev/null || grep -q 'fabrient-mcp' render.yml
